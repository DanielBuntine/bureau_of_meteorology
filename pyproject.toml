[project]
name = "bureau-of-meteorology"
version = "0.1.0"
requires-python = ">=3.13.2,<3.14"

[dependency-groups]
dev = [
    # Pins the Home Assistant release to test against, plus the matching
    # pytest, pytest-asyncio and pytest-cov, so none of those are pinned
    # again here. The integration's own minimum supported core is declared
    # in hacs.json (2025.2.0); this is the version CI exercises.
    "pytest-homeassistant-custom-component==0.13.316",
    "ruff==0.16.8",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "D",    # pydocstyle
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
